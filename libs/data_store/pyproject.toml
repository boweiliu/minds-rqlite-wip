[project]
name = "data-store"
version = "0.1.0"
description = "Secure SQLite-backed JSON document store with a token-protected API for external agents and a private viewer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "werkzeug>=3.0",
    "httpx>=0.27",
]

[project.scripts]
data-store = "data_store.runner:main"
data-store-tunnel = "data_store.tunnel:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_store"]
