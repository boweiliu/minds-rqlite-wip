<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data Store</title>
    <style>
      /* Simple, grayscale, easy to read. No color, minimal chrome. */
      :root {
        --ink: #1a1a1a;
        --muted: #6b6b6b;
        --line: #d8d8d8;
        --panel: #f4f4f4;
        --panel-2: #ececec;
        --bg: #ffffff;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--bg);
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      header {
        border-bottom: 1px solid var(--line);
        padding: 16px 22px;
      }
      header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
      header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      nav {
        display: flex; gap: 4px; padding: 10px 18px 0; border-bottom: 1px solid var(--line);
      }
      nav button {
        border: 1px solid transparent; border-bottom: none;
        background: none; color: var(--muted);
        padding: 8px 14px; font-size: 14px; cursor: pointer;
        border-radius: 6px 6px 0 0;
      }
      nav button:hover { color: var(--ink); }
      nav button.active {
        color: var(--ink); background: var(--bg);
        border-color: var(--line); margin-bottom: -1px; font-weight: 600;
      }
      main { padding: 22px; max-width: 900px; }
      h2 { font-size: 15px; margin: 0 0 12px; }
      .muted { color: var(--muted); }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .card { border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
      .field-label { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
      code { font-family: var(--mono); font-size: 13px; }
      pre {
        font-family: var(--mono); font-size: 13px;
        background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
        padding: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; margin: 0;
      }
      .mono-box {
        font-family: var(--mono); font-size: 13px; background: var(--panel);
        border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px;
        overflow-x: auto; white-space: nowrap; flex: 1; min-width: 0;
      }
      button.action {
        border: 1px solid var(--line); background: var(--panel); color: var(--ink);
        border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer;
      }
      button.action:hover { background: var(--panel-2); }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
      th { color: var(--muted); font-weight: 600; }
      td.mono, th.mono { font-family: var(--mono); font-size: 12px; }
      .list-item {
        display: flex; justify-content: space-between; align-items: center;
        border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
      }
      .list-item:hover { background: var(--panel); }
      .count { color: var(--muted); font-variant-numeric: tabular-nums; }
      .doc { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 12px; }
      .doc .doc-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
      .doc .doc-id { font-family: var(--mono); font-size: 12px; }
      .doc pre { border: none; border-radius: 0; background: var(--bg); }
      .empty { color: var(--muted); padding: 28px 0; }
      .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; color: var(--muted); }
      .back { background: none; border: none; color: var(--muted); cursor: pointer; padding: 0; font-size: 13px; margin-bottom: 12px; }
      .back:hover { color: var(--ink); }
      a { color: var(--ink); }
    </style>
  </head>
  <body>
    <header>
      <h1>Data Store</h1>
      <p>A private store your other agents read and write over the internet, using a secret token.</p>
    </header>
    <nav id="nav"></nav>
    <main id="main"><div class="empty">Loading&hellip;</div></main>

    <script>
      let TOKEN = null;
      let CONN = null; // full connection info
      let tab = "collections";
      let openCollection = null;

      function el(tag, attrs, kids) {
        const n = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs || {})) {
          if (k === "class") n.className = v;
          else if (k === "onclick") n.onclick = v;
          else if (k === "html") n.innerHTML = v;
          else n.setAttribute(k, v);
        }
        for (const c of [].concat(kids || [])) {
          if (c == null) continue;
          n.append(c.nodeType ? c : document.createTextNode(String(c)));
        }
        return n;
      }

      async function api(path, opts) {
        const o = Object.assign({ headers: {} }, opts || {});
        o.headers["Authorization"] = "Bearer " + TOKEN;
        return fetch("api" + path, o);
      }

      async function boot() {
        const res = await fetch("api/local/connection");
        if (res.status === 403) return restricted();
        if (!res.ok) return fail("Could not load. Is the service running?");
        CONN = await res.json();
        TOKEN = CONN.token;
        renderNav();
        render();
      }

      function restricted() {
        document.getElementById("nav").replaceChildren();
        document.getElementById("main").replaceChildren(
          el("div", { class: "card" }, [
            el("h2", {}, "This is a protected API"),
            el("p", { class: "muted" }, "Access needs the secret token. Open this page from your workspace to manage the store."),
          ])
        );
      }

      function fail(msg) { document.getElementById("main").replaceChildren(el("div", { class: "empty" }, msg)); }

      function renderNav() {
        const nav = document.getElementById("nav");
        const tabs = [
          ["collections", "Collections"],
          ["connection", "Connection"],
          ["activity", "Activity"],
        ];
        nav.replaceChildren(
          ...tabs.map(([id, label]) =>
            el("button", {
              class: tab === id ? "active" : "",
              onclick: () => { tab = id; openCollection = null; renderNav(); render(); },
            }, label)
          )
        );
      }

      function render() {
        if (tab === "collections") return openCollection ? renderDocuments() : renderCollections();
        if (tab === "connection") return renderConnection();
        if (tab === "activity") return renderActivity();
      }

      async function renderCollections() {
        const res = await api("/collections");
        const data = await res.json();
        const list = (data.collections || []).map((c) =>
          el("div", { class: "list-item", onclick: () => { openCollection = c.name; render(); } }, [
            el("span", {}, c.name),
            el("span", { class: "count" }, c.count + (c.count === 1 ? " item" : " items")),
          ])
        );
        document.getElementById("main").replaceChildren(
          el("h2", {}, "Collections"),
          el("p", { class: "muted" }, "Groups of stored items. Your agents create these by writing to them."),
          list.length ? el("div", {}, list) : el("div", { class: "empty" }, "Nothing stored yet."),
        );
      }

      async function renderDocuments() {
        const res = await api("/collections/" + encodeURIComponent(openCollection) + "?limit=200");
        const data = await res.json();
        const docs = (data.documents || []).map((d) =>
          el("div", { class: "doc" }, [
            el("div", { class: "doc-head" }, [
              el("span", { class: "doc-id" }, d.id),
              el("span", { class: "row" }, [
                el("span", { class: "muted", style: "font-size:12px" }, "updated " + d.updated_at),
                el("button", { class: "action", onclick: () => del(d.id) }, "Delete"),
              ]),
            ]),
            el("pre", {}, JSON.stringify(d.body, null, 2)),
          ])
        );
        document.getElementById("main").replaceChildren(
          el("button", { class: "back", onclick: () => { openCollection = null; render(); } }, "← All collections"),
          el("h2", {}, openCollection),
          el("p", { class: "muted" }, data.total + (data.total === 1 ? " item" : " items")),
          docs.length ? el("div", {}, docs) : el("div", { class: "empty" }, "This collection is empty."),
        );
      }

      async function del(id) {
        if (!confirm("Delete item '" + id + "'?")) return;
        await api("/collections/" + encodeURIComponent(openCollection) + "/" + encodeURIComponent(id), { method: "DELETE" });
        render();
      }

      function renderConnection() {
        const base = CONN.api_base || "(tunnel starting…)";
        const permanent = CONN.permanent_url;
        const curlRead = "curl " + base + "/collections \\\n  -H \"Authorization: Bearer " + TOKEN + "\"";
        const curlWrite =
          "curl -X POST " + base + "/collections/notes \\\n" +
          "  -H \"Authorization: Bearer " + TOKEN + "\" \\\n" +
          "  -H \"Content-Type: application/json\" \\\n" +
          "  -d '{\"text\": \"hello\"}'";

        const stability = permanent
          ? el("p", { class: "muted" }, ["This address is ", el("strong", {}, "permanent"), " (ngrok reserved domain)."])
          : el("div", {}, [
              el("p", { class: "muted" }, [
                "This address is ", el("strong", {}, "temporary"),
                " and can change if the tunnel restarts. To make it permanent, get a free ngrok token and static domain at ngrok.com, then just ask your agent to set it up.",
              ]),
            ]);

        document.getElementById("main").replaceChildren(
          el("div", { class: "card" }, [
            el("h2", {}, "How to connect"),
            el("div", { class: "field-label" }, "API address"),
            el("div", { class: "row" }, [
              el("div", { class: "mono-box" }, base),
              el("button", { class: "action", onclick: () => navigator.clipboard.writeText(base) }, "Copy"),
            ]),
            el("div", { style: "height:14px" }),
            el("div", { class: "field-label" }, "Secret token"),
            el("div", { class: "row" }, [
              el("div", { class: "mono-box" }, TOKEN),
              el("button", { class: "action", onclick: () => navigator.clipboard.writeText(TOKEN) }, "Copy"),
              el("button", { class: "action", onclick: rotate }, "Rotate"),
            ]),
            el("p", { class: "muted", style: "font-size:12px;margin-bottom:0" },
              "Anyone with this token can read and write the store. Rotating it stops the old one immediately."),
          ]),
          el("div", { class: "card" }, [el("h2", {}, "Stability"), stability]),
          el("div", { class: "card" }, [
            el("h2", {}, "Read example"),
            el("pre", {}, curlRead),
            el("h2", { style: "margin-top:16px" }, "Write example"),
            el("pre", {}, curlWrite),
          ]),
        );
      }

      async function rotate() {
        if (!confirm("Rotate the token? The current one stops working immediately.")) return;
        const res = await fetch("api/local/rotate", { method: "POST" });
        const data = await res.json();
        TOKEN = data.token;
        renderConnection();
      }

      async function renderActivity() {
        const res = await api("/audit?limit=200");
        const data = await res.json();
        const rows = (data.entries || []).map((e) =>
          el("tr", {}, [
            el("td", { class: "mono muted" }, e.ts),
            el("td", {}, e.method),
            el("td", { class: "mono" }, e.path),
            el("td", {}, String(e.status)),
            el("td", {}, el("span", { class: "tag" }, e.authed ? "authorized" : "no token")),
            el("td", { class: "mono muted" }, e.remote || ""),
          ])
        );
        document.getElementById("main").replaceChildren(
          el("h2", {}, "Activity"),
          el("p", { class: "muted" }, "Every request made to the store, newest first."),
          rows.length
            ? el("table", {}, [
                el("thead", {}, el("tr", {}, ["Time", "Method", "Path", "Status", "Auth", "Client"].map((h) => el("th", { class: h === "Time" || h === "Path" || h === "Client" ? "mono" : "" }, h)))),
                el("tbody", {}, rows),
              ])
            : el("div", { class: "empty" }, "No requests yet."),
        );
      }

      boot();
    </script>
  </body>
</html>
